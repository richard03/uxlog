# Obecná konfigurace aplikace – UXLog
#
# projectColors        paleta barev projektů (nový projekt dostane první nepoužitou)
# canvasCardColors     paleta barev kartiček na Canvasu (color = hex #rrggbb, labelKey = název barvy v cs.js canvas.colors);
#                      barvu písma aplikace dopočítá podle kontrastu
# vaultAutoImport      pojistka automatického načítání změn ze Složky dat – nezvykle velkou dávku změn
#                      (synchronizace, git, smazaná složka) aplikace nenačte sama, jen přes náhled:
#   maxDeletes         nejvýš tolik smazaných souborů najednou
#   maxShare           nejvýš takový podíl záznamů jednoho projektu změněných/smazaných najednou (0–1)
#   minChanges         podíl se posuzuje až od tohoto počtu změn v projektu
# recommendations      doporučení dalších aktivit v panelu Aktivity
#   minRequirementsForPrioritization  od kolika požadavků se stejnou prioritou doporučit prioritizační workshop
# dictation            diktování přes konektor Recognita – časové limity v ms
#   connectTimeoutMs   jak dlouho čekat na navázání spojení
#   slowAfterMs        po jak dlouhé odmlce serveru ukázat „server odpovídá pomalu“ (diktování běží dál)
#   stallAfterMs       po jak dlouhé odmlce serveru diktování ukončit jako výpadek (text zůstane)
#   finishTimeoutMs    jak dlouho po ukončení čekat na dokončení přepisu (pak zůstane dosavadní text)
# ai                   požadavky na AI služby (OpenAI, Gemini)
#   requestTimeoutMs   nejdelší čekání na odpověď jednoho požadavku v ms (pak se nahlásí chyba)

projectColors:
  - "#e05252" # červená
  - "#e07c4a" # oranžová
  - "#e0b84a" # jantarová
  - "#6abd6a" # zelená
  - "#4aaa8a" # tyrkysová
  - "#4a90d9" # modrá
  - "#6e7fdd" # indigo
  - "#9c6dd0" # fialová
  - "#d06db0" # růžová
  - "#8d6e63" # hnědá
  - "#78909c" # šedomodrá
  - "#26c6da" # azurová
canvasCardColors:
  - color: "#fde68a"
    labelKey: yellow
  - color: "#fdba74"
    labelKey: orange
  - color: "#fca5a5"
    labelKey: red
  - color: "#f9a8d4"
    labelKey: pink
  - color: "#c4b5fd"
    labelKey: violet
  - color: "#93c5fd"
    labelKey: blue
  - color: "#67e8f9"
    labelKey: cyan
  - color: "#86efac"
    labelKey: green
  - color: "#dc2626"
    labelKey: darkRed
  - color: "#2563eb"
    labelKey: darkBlue
  - color: "#15803d"
    labelKey: darkGreen
  - color: "#475569"
    labelKey: slate
recommendations:
  minRequirementsForPrioritization: 5
vaultAutoImport:
  maxDeletes: 10
  maxShare: 0.3
  minChanges: 5
ai:
  requestTimeoutMs: 120000
dictation:
  connectTimeoutMs: 12000
  slowAfterMs: 8000
  stallAfterMs: 20000
  finishTimeoutMs: 20000
