# Typy entit (artefakty projektu) – datová struktura – UXLog
#
# entities.<typ>:
#   codePrefix    prefix automatického kódu (PER-001 …); jen entity s kódem v hlavičce detailu
#   defaults      výchozí hodnoty nové entity (factory). id, projectId a časová razítka doplňuje kód.
#                 Při čtení uložených dat se chybějící pole doplní odsud – pole nemažte, jen přidávejte.
#   fields        atributy zobrazené ve formuláři/detailu (uživatel je může dál upravit v Konfiguraci):
#                   key        klíč v entitě
#                   labelKey   cesta k textu v src/i18n/cs.js (texty pro uživatele patří do i18n)
#                   type       text | textarea | url | select | email | tel | date | number-unit
#                   sortOrder  pořadí
#                   searchable true = prohledává se ve fulltextu
#                   options    pro select: { value, labelKey }
#                   valueKey / unitKey / units   pro number-unit
#                   visibleWhen { field, value } – pole se zobrazí jen při dané hodnotě jiného pole
#   completeness  pole započítaná do skóre úplnosti; { field, when: { field, value } } = jen za podmínky

entities:

  project:
    defaults:
      name: ''
      scope: medium
      priority: medium
      phase: research
      deadline: ''
      notebook: ''
      notebookHistory: []
      sortOrder: 9999
      color: ''

  goal:
    codePrefix: GOL
    defaults:
      code: ''
      name: ''
      description: ''
      metrics: ''
      url: ''
      sortOrder: 9999
      customFields: {}
    fields:
      - key: description
        labelKey: goal.description
        type: textarea
        sortOrder: 10
        searchable: true
      - key: metrics
        labelKey: goal.metrics
        type: textarea
        sortOrder: 20
        searchable: true
      - key: url
        labelKey: goal.url
        type: url
        sortOrder: 30
        searchable: true
    completeness:
      - name
      - description
      - metrics

  stakeholder:
    defaults:
      name: ''
      description: ''
      influenceLevel: ''
      interestLevel: ''
      attitude: ''
      commFrequency: ''
      commChannel: ''
      commNeeds: ''
      requirementIds: []
      sortOrder: 9999
      customFields: {}
    fields:
