          - value: high
            labelKey: stakeholderLevel.high
          - value: medium
            labelKey: stakeholderLevel.medium
          - value: low
            labelKey: stakeholderLevel.low
      - key: interestLevel
        labelKey: stakeholder.interestLevel
        type: select
        sortOrder: 30
        searchable: true
        options:
          - value: ''
            labelKey: stakeholderLevel.
          - value: high
            labelKey: stakeholderLevel.high
          - value: medium
            labelKey: stakeholderLevel.medium
          - value: low
            labelKey: stakeholderLevel.low
      - key: attitude
        labelKey: stakeholder.attitude
        type: select
        sortOrder: 40
        searchable: true
        options:
          - value: ''
            labelKey: stakeholderAttitude.
          - value: positive
            labelKey: stakeholderAttitude.positive
          - value: neutral
            labelKey: stakeholderAttitude.neutral
          - value: negative
            labelKey: stakeholderAttitude.negative
      - key: commFrequency
        labelKey: stakeholder.commFrequency
        type: text
        sortOrder: 50
        searchable: true
      - key: commChannel
        labelKey: stakeholder.commChannel
        type: text
        sortOrder: 60
        searchable: true
      - key: commNeeds
        labelKey: stakeholder.commNeeds
        type: textarea
        sortOrder: 70
        searchable: true
    completeness:
