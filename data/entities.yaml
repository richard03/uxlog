        searchable: true
        visibleWhen:
          field: priority
          value: wont
      - key: url
        labelKey: requirement.url
        type: url
        sortOrder: 50
        searchable: true
    completeness:
      - name
      - description
      - motivation
      - field: wontHaveExplanation
        when:
          field: priority
          value: wont

  activity:
