[package]
name = "uxlog"
version = "1.2.35"
description = "UXLog – desktop aplikace pro logování UX design procesu"
authors = ["UXLog"]
edition = "2021"

[lib]
name = "uxlog_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tiny_http = "0.12"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
